# OceanGraph model routing (safe to edit and commit: no API keys live here).
#
# Edit only this file when the generation or verification endpoint changes.
# Put the actual secrets in the named environment variables, for example:
#   $env:PARATERA_API_KEY = "..."
#   $env:DEEPSEEK_API_KEY = "..."

schema_version: 1

# Legacy/default route used only when a stage has no explicit profile below.
backend:
  active: OPENAI
  openai:
    url: https://llmapi.paratera.com/v1/chat/completions
    llm_model: Qwen3.7-Plus
    vlm_model: Qwen3.7-Plus
    timeout: 300

models:
  profiles:
    # Qwen generates retrieval queries, multi-hop questions, short answers,
    # reasoning annotations, and optional corrections.
    generator:
      backend: OPENAI
      url: https://llmapi.paratera.com/v1/chat/completions
      api_key_env: PARATERA_API_KEY
      model: Qwen3.7-Plus
      supports_vision: false
      temperature: 0.0
      thinking: false
      structured_output: true
      max_output_tokens: 2048
      timeout: 300

    # DeepSeek is used only for the final validation stage by default.
    verifier:
      backend: OPENAI
      url: https://api.deepseek.com/chat/completions
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-pro
      supports_vision: false
      temperature: 0.0
      structured_output: true
      max_output_tokens: 512
      timeout: 300

  stages:
    default: generator
    corpus: generator
    retrieval: generator
    generation: generator
    selection: verifier
    verification: verifier
    correction: generator

rate_limiting:
  requests_per_minute: 60
  burst_size: 15
